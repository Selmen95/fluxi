[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxi-showcase"
version = "0.1.0"
description = "Showcase of a purchasing automation platform: messy Excel ingestion, replenishment rules, invoice control and a tool-using agent orchestrator, on synthetic data."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fluxi-demo = "fluxi_showcase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
